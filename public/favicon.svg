<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="50%" stop-color="#e9d5ff" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
  </defs>

  <!-- Outer Squircle with Gradient Border -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#borderGrad)" />
  <rect x="36" y="36" width="440" height="440" rx="100" fill="url(#bgGrad)" />

  <!-- MYK Bold Text Centered -->
  <text x="256" y="268" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="190" 
        letter-spacing="2" 
        text-anchor="middle" 
        dominant-baseline="central"
        fill="url(#textGrad)">MYK</text>
</svg>
